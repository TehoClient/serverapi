name: Release

on:
  push:
    tags:
      - 'sdk-v*'

permissions:
  contents: read

concurrency:
  group: sdk-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      TEHO_REPO_URL: https://repo.tehoclient.dev
      TEHO_REPO_USER: ${{ secrets.TEHO_REPO_USER }}
      TEHO_REPO_TOKEN: ${{ secrets.TEHO_REPO_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Read the release version
        id: version
        run: |
          tag="${GITHUB_REF_NAME#sdk-v}"
          declared="$(sed -n 's/^version=//p' gradle.properties)"
          if [ "$tag" != "$declared" ]; then
            echo "Tag says $tag but gradle.properties says $declared" >&2
            exit 1
          fi
          echo "value=$tag" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            21
            25

      - name: Build and test the Java SDK
        run: bash ./gradlew --no-daemon build

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python build tools
        run: python -m pip install --upgrade build

      - uses: dtolnay/rust-toolchain@stable

      - name: Validate lightweight versions, tests and packages before publishing
        run: bash .github/scripts/publish.sh "${{ steps.version.outputs.value }}" --check

      - name: Publish the Java SDK
        run: bash ./gradlew --no-daemon publishAllPublicationsToTehoRepository

      - name: Publish the Node, Python and Rust libraries
        run: bash .github/scripts/publish.sh "${{ steps.version.outputs.value }}"
