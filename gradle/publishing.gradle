apply plugin: 'maven-publish'

def snapshot = project.version.toString().endsWith('SNAPSHOT')
def repoBase = providers.environmentVariable('TEHO_REPO_URL').orElse('https://repo.tehoclient.dev').get()

ext.tehoRepositories = { handler ->
	handler.maven {
		name = 'teho'
		url = "${repoBase}/${snapshot ? 'snapshots' : 'releases'}"
		credentials {
			username = providers.environmentVariable('TEHO_REPO_USER').orNull
			password = providers.environmentVariable('TEHO_REPO_TOKEN').orNull
		}
	}
	handler.maven {
		name = 'build'
		url = rootProject.layout.buildDirectory.dir('repo')
	}
}

ext.tehoPom = { pom, String title, String summary ->
	pom.name = title
	pom.description = summary
	pom.url = 'https://tehoclient.dev'
	pom.licenses {
		license {
			name = 'MIT License'
			url = 'https://opensource.org/license/mit'
			distribution = 'repo'
		}
	}
	pom.scm {
		url = 'https://github.com/TehoClient/serverapi'
		connection = 'scm:git:https://github.com/TehoClient/serverapi.git'
		developerConnection = 'scm:git:ssh://git@github.com/TehoClient/serverapi.git'
	}
	pom.developers {
		developer {
			id = 'sgm'
			name = 'SGM Studios LTD'
			url = 'https://tehoclient.com'
		}
	}
}
