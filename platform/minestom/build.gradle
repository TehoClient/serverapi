apply plugin: 'maven-publish'

dependencies {
	compileOnly 'net.minestom:minestom:2026.10.07-26.2'
	compileOnly 'org.slf4j:slf4j-api:2.0.20'
	compileOnly project(':common')
}

tasks.withType(JavaCompile).configureEach {
	options.release = 25
}

base {
	archivesName = 'teho-api-minestom'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
	withSourcesJar()
}

jar {
	dependsOn ':protocol:jar', ':api:jar', ':common:jar'
	from(project(':protocol').sourceSets.main.output)
	from(project(':api').sourceSets.main.output)
	from(project(':common').sourceSets.main.output)
}

sourcesJar {
	from(project(':protocol').sourceSets.main.allSource)
	from(project(':api').sourceSets.main.allSource)
	from(project(':common').sourceSets.main.allSource)
}

publishing {
	publications {
		maven(MavenPublication) {
			artifactId = 'teho-api-minestom'
			from components.java
		}
	}
}
