name: TehoAPI
version: ${version}
main: dev.tehoclient.api.bukkit.TehoApiPlugin
api-version: '1.13'
folia-supported: true
author: Teho
description: Lets servers talk to players on Teho Client.
commands:
  tehoapi:
    description: Inspect and test the Teho Server API.
    usage: /tehoapi
    permission: tehoapi.admin
permissions:
  tehoapi.admin:
    default: op
  tehoapi.staff.xray:
    default: false
  tehoapi.staff.esp:
    default: false
  tehoapi.staff.freecam:
    default: false
  tehoapi.staff.moderate:
    default: false
  tehoapi.staff.admin:
    default: false
